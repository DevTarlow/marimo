# What has to be true before this can be released.
#
# The two checks at the end are the ones worth the runner minutes. A unit test
# cannot see a preload bridge that stopped matching the contract, a renderer that
# no longer mounts, a second window that does not open, or a job runner that
# cannot start from a packaged build — and every one of those has been a real bug
# in this repository rather than a hypothetical.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is deliberately *not* given here. `package.json` already
      # pins it with `packageManager`, and pnpm/action-setup refuses to run when
      # both say a version — `version: 11` beside `pnpm@11.7.0` fails the job at
      # its first step with ERR_PNPM_BAD_PM_VERSION. One source of truth, and it
      # is the one a developer's `pnpm install` already obeys.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Boots a real window over the DevTools protocol and asserts the bridge
      # answers, React mounted, the conversation round-trips, the companion
      # window is up and transparent, and a fresh install can reach the provider
      # card rather than showing a chat that cannot answer.
      - name: Smoke
        run: xvfb-run --auto-servernum pnpm --filter @marimo/desktop smoke
        env:
          MARIMO_NO_SANDBOX: '1'

      # The packaged runner is the one thing that works in development and can
      # be broken by packaging alone: `ELECTRON_RUN_AS_NODE=1` has no asar
      # support, so an archive it cannot read leaves the background service
      # silently unable to start.
      #
      # Nothing is fetched and no model is bundled: the app carries no chat model,
      # so packaging is a build rather than a build plus a gigabyte. What this step
      # proves is unchanged — that the app packages and the packaged runner starts
      # — and the runner is expected to report the recall model as not installed,
      # which is a state it has to handle anyway.
      - name: Package, and prove the runner still starts
        run: |
          pnpm --filter @marimo/desktop package
          APP="apps/desktop/release/linux-unpacked"
          ELECTRON_RUN_AS_NODE=1 "$APP/marimo-agent" \
            "$PWD/$APP/resources/app/dist/runner/run-due.js" --json
        env:
          MARIMO_USER_DATA_DIR: ${{ runner.temp }}/marimo-ci
